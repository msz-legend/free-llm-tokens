name: daily-refresh

on:
  schedule:
    # 22:30 UTC = 次日 06:30 北京时间，每天早上产出当日免费源报告
    - cron: "30 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: sandbox tests
        run: npm test

      - name: refresh (feed discovery + report)
        env:
          FREE_MODELS_STATE_HOME: ${{ github.workspace }}/.ci-state
        run: node scripts/refresh.js --json || echo "::warning::refresh exited nonzero (network?)"

      - name: publish report (skip silently if none produced)
        run: |
          f=".ci-state/.free-models/reports/$(date -u +%F).md"
          if [ -f "$f" ]; then
            mkdir -p reports
            cp "$f" "reports/$(date -u +%F).md"
            cp "$f" reports/latest.md
          else
            echo "no report today"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          git diff --cached --quiet || git commit -m "daily report $(date -u +%F)"
          git push
